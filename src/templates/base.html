{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Blog de Cocina{% endblock %}</title>
    <meta name="description" content="{% block description %}Recetas caseras compartidas de forma sencilla.{% endblock %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera__fila">
            <a class="cabecera__logo" href="{% url 'recetas:inicio' %}">Blog de Cocina</a>
            <a class="boton" href="{% url 'recetas:nueva' %}">Nueva receta</a>
        </div>
    </header>

    <main class="contenedor principal">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
